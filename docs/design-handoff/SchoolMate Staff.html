<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SchoolMate Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #e9e6dd 0%, #d9d6cc 55%, #cbc8bd 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px; font-family: 'Manrope', sans-serif;
  }
  #root { display: flex; align-items: center; justify-content: center; }
  button { font-family: inherit; -webkit-appearance: none; }
  input { -webkit-appearance: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes sm-shimmer { 0% { opacity: .55; } 50% { opacity: 1; } 100% { opacity: .55; } }
  .sm-shimmer { animation: sm-shimmer 1.3s ease-in-out infinite; }

  @keyframes sm-float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(16px,22px); } }
  @keyframes sm-float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,18px); } }
  .sm-float { animation: sm-float 9s ease-in-out infinite; }
  .sm-float2 { animation: sm-float2 11s ease-in-out infinite; }

  @keyframes sm-pulse { 0% { transform: scale(0.7); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  .sm-pulse { animation: sm-pulse 2s ease-out infinite; }

  @keyframes sm-blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .sm-blink { animation: sm-blink 1.6s ease-in-out infinite; }

  @keyframes sm-dotb { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-7px); opacity: 1; } }
  .sm-dot { animation: sm-dotb 1s ease-in-out infinite; }

  @keyframes sm-spin { to { transform: rotate(360deg); } }
  .sm-sweep { animation: sm-spin 2.4s linear infinite; }
  .sm-ckspin { animation: sm-spin .8s linear infinite; }

  @keyframes sm-pop { 0% { transform: translate(-50%,-50%) scale(0); } 60% { transform: translate(-50%,-50%) scale(1.2); } 100% { transform: translate(-50%,-50%) scale(1); } }
  .sm-pop { animation: sm-pop .5s cubic-bezier(.2,.8,.2,1); }

  @keyframes sm-fade { from { transform: translateY(12px); } to { transform: none; } }
  .sm-view-fade { animation: sm-fade .42s cubic-bezier(.2,.8,.2,1); }

  @keyframes sm-push { from { transform: translateX(28px); } to { transform: none; } }
  .sm-view-push { animation: sm-push .36s cubic-bezier(.2,.8,.2,1); }

  @keyframes sm-sheet { from { transform: translateY(100%); } to { transform: none; } }
  .sm-sheet { animation: sm-sheet .34s cubic-bezier(.2,.8,.2,1); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/theme.jsx"></script>
  <script type="text/babel" src="app/i18n.jsx"></script>
  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/screens-auth.jsx"></script>
  <script type="text/babel" src="app/screens-home.jsx"></script>
  <script type="text/babel" src="app/screens-attendance.jsx"></script>
  <script type="text/babel" src="app/screens-work.jsx"></script>
  <script type="text/babel" src="app/screens-driver-profile.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
